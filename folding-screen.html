<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화성능행도 · 여덟 폭의 원행</title>
<style>
  :root{color-scheme:dark;--ink:#f0e4cb;--muted:#c9b697;--accent:#eaa677;background:#201913;color:var(--ink);font:16px/1.55 "Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  *{box-sizing:border-box}
  body{margin:0}
  a{color:inherit;text-underline-offset:.25em}
  :focus-visible{outline:2px solid var(--accent);outline-offset:5px}
  .masthead{position:fixed;z-index:3;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.05rem clamp(1rem,4vw,4rem);background:linear-gradient(#201913,#201913ec 55%,transparent)}
  .masthead strong{letter-spacing:.045em;font-size:.95rem}
  .masthead a{font-size:.8rem;color:var(--muted)}
  nav{position:fixed;z-index:3;right:clamp(1rem,4vw,4rem);top:50%;transform:translateY(-50%);display:grid;gap:3px}
  nav a{display:grid;place-items:center;width:2rem;height:2rem;text-decoration:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.72rem}
  nav a[aria-current=true]{background:var(--accent);color:#201913;border-radius:50%}
  .chapter{height:235svh;position:relative}
  .scene{position:sticky;top:0;height:100svh;display:grid;grid-template-columns:1fr minmax(0,auto) 1fr;align-items:center;justify-items:center;gap:clamp(1rem,3.5vw,5rem);padding:4rem 4rem 2rem;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#443123 0%,#201913 72%)}
  .caption{grid-column:1;justify-self:end;width:min(100%,14rem)}
  .sequence,.state{font-size:.75rem;color:var(--accent);letter-spacing:.06em}
  h2{margin:.4rem 0;line-height:1.18;font:clamp(1.55rem,3vw,3.8rem)/1.18 AppleMyungjo,"Nanum Myeongjo",serif;word-break:keep-all}
  .original-name{margin:.4rem 0 1.25rem;font-size:.88rem;color:var(--muted)}
  .state{display:block;min-height:1.4em;color:var(--muted)}
  .art{grid-column:2;position:relative;margin:0;height:min(83svh,calc(100svh - 6rem));max-width:46vw;aspect-ratio:var(--ratio);box-shadow:0 0 0 1px #cbb58344,0 18px 50px #10070088;overflow:hidden;background:#b2946e}
  .art img,.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .art img{object-fit:fill}
  .art canvas{visibility:hidden}
  .art[data-animated] canvas{visibility:visible}
  .art[data-animated] img{visibility:hidden}
  .progress{position:fixed;z-index:4;inset:auto 0 0;height:3px;background:#fff1;pointer-events:none}
  .progress i{width:100%;height:100%;display:block;transform:scaleX(0);transform-origin:left;background:var(--accent)}
  .credit{text-align:center;padding:2rem 1rem 3rem;color:var(--muted);font-size:.85rem;background:#201913}
  .credit a{display:inline-block;margin:.25rem .7rem}
  @media(max-width:700px){
    .masthead{padding:.7rem 1rem}
    .scene{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:.5rem;align-content:center;padding:3.4rem 2.6rem 1.6rem 1.15rem}
    .caption{justify-self:center;text-align:center;width:100%}
    .art{grid-column:1;height:min(71svh,calc((100vw - 4rem) / var(--ratio)));max-width:none}
    .original-name{margin:.1rem 0;font-size:.72rem}
    h2{margin:.15rem 0}
    nav{right:.25rem;gap:0}
    nav a{width:1.8rem;height:1.8rem}
  }
</style>
</head>
<body>
<header class="masthead"><strong>화성능행도병풍</strong><a href="journey.html">정조 화성행차 · 첫 이틀 보기 →</a><a href="scenes/screen/full-screen.jpg" target="_blank" rel="noopener">8폭 전체 사진 ↗</a></header>
<nav aria-label="병풍 장면으로 이동"></nav>
<main id="chapters"></main>
<footer class="credit">
  <p>국립고궁박물관 소장 《화성능행도병풍》 · 병풍 배열 순서</p>
  <a href="https://commons.wikimedia.org/wiki/File:Painting_of_the_Royal_Procession_to_Hwaseong_on_Eight-panel_Folding_Screen.jpeg" target="_blank" rel="noopener">도판 이미지 출처 ↗</a>
  <a href="https://online.gogung.go.kr/gogung/pgm/psgudMng/view.do?menuNo=800065&amp;psgudSn=358387" target="_blank" rel="noopener">국립고궁박물관 작품 해설 ↗</a>
</footer>
<div class="progress" aria-hidden="true"><i></i></div>
<script src="folding-screen.js"></script>
</body>
</html>
